# =============================================================================
# Build SPOOL on every push to main and on tag pushes.
# When triggered by a tag like `v1.0.0`, the workflow uploads the built
# artefacts to a GitHub Release of the same tag — Windows VST3 + Standalone,
# macOS VST3 + AU + Standalone (.app).
# =============================================================================

name: build

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:

  # ---- Windows --------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build SPOOL (Release)
        run: cmake --build build --config Release --target SPOOL_Standalone SPOOL_VST3 --parallel

      - name: Stage Windows artefacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/windows | Out-Null
          Copy-Item build/SPOOL_artefacts/Release/Standalone/SPOOL.exe       stage/windows/
          Copy-Item -Recurse build/SPOOL_artefacts/Release/VST3/SPOOL.vst3   stage/windows/
          Compress-Archive -Path stage/windows/* -DestinationPath SPOOL-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SPOOL-windows
          path: SPOOL-windows.zip

  # ---- macOS ----------------------------------------------------------------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -G Xcode

      - name: Build SPOOL (Release)
        run: cmake --build build --config Release --target SPOOL_Standalone SPOOL_VST3 SPOOL_AU --parallel

      - name: Stage macOS artefacts
        run: |
          mkdir -p stage/macos
          cp -R build/SPOOL_artefacts/Release/Standalone/SPOOL.app stage/macos/
          cp -R build/SPOOL_artefacts/Release/VST3/SPOOL.vst3       stage/macos/
          cp -R build/SPOOL_artefacts/Release/AU/SPOOL.component    stage/macos/
          cd stage/macos
          zip -r ../../SPOOL-macos.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: SPOOL-macos
          path: SPOOL-macos.zip

  # ---- Linux ----------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            ladspa-sdk libcurl4-openssl-dev \
            libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build SPOOL (Release)
        run: cmake --build build --target SPOOL_Standalone SPOOL_VST3 --parallel

      - name: Stage Linux artefacts
        run: |
          mkdir -p stage/linux
          cp build/SPOOL_artefacts/Standalone/SPOOL stage/linux/
          cp -R build/SPOOL_artefacts/VST3/SPOOL.vst3 stage/linux/
          cd stage/linux
          tar -czf ../../SPOOL-linux.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: SPOOL-linux
          path: SPOOL-linux.tar.gz

  # ---- Release (only on tags) ----------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, macos, linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SPOOL-windows/SPOOL-windows.zip
            dist/SPOOL-macos/SPOOL-macos.zip
            dist/SPOOL-linux/SPOOL-linux.tar.gz
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
